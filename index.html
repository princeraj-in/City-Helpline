<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F19" />
    
    <!-- App 3D Logo & Favicons for URL search and tabs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="City Helpline" />
    
    <!-- Primary Meta Tags -->
    <title>City Helpline - Student PGs, Mess, Libraries, Marketplace & Budget Estimator</title>
    <meta name="title" content="City Helpline - Student PGs, Mess, Libraries, Marketplace & Budget Estimator" />
    <meta name="description" content="Hyper-local student ecosystem platform for verified PGs, libraries, mess facilities, marketplace, and monthly student budget estimator." />
    <meta name="keywords" content="PG, hostel, mess, tiffin service, library, study room, student budget calculator, student marketplace, Kota, Delhi, Patna, Sikar, City Helpline" />
    <meta name="author" content="City Helpline" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.imprince.me/" />
    <meta property="og:title" content="City Helpline - Student PGs, Mess, Libraries, Marketplace & Budget Estimator" />
    <meta property="og:description" content="Hyper-local student ecosystem platform for verified PGs, libraries, mess facilities, marketplace, and monthly student budget estimator." />
    <meta property="og:image" content="https://app.imprince.me/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://app.imprince.me/" />
    <meta property="twitter:title" content="City Helpline - Student PGs, Mess, Libraries, Marketplace & Budget Estimator" />
    <meta property="twitter:description" content="Hyper-local student ecosystem platform for verified PGs, libraries, mess facilities, marketplace, and monthly student budget estimator." />
    <meta property="twitter:image" content="https://app.imprince.me/logo.png" />

    <!-- Early PWA Install Event Trap & Service Worker Registration -->
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('SW registration:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-gray-900 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
