<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#11162D"/>
      <stop offset="60%" stop-color="#080A14"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- S Top Ribbon Cyan to Blue Gradient -->
    <linearGradient id="topRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="topRibbonHighlight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- S Center Transition Gradient (Cyan to Purple) -->
    <linearGradient id="centerRibbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- S Bottom Ribbon Purple to Magenta Gradient -->
    <linearGradient id="bottomRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="45%" stop-color="#C026D3"/>
      <stop offset="80%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Winding Highway / Road Glow -->
    <linearGradient id="roadGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Graduation Cap Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#1E3A8A"/>
      <stop offset="70%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- City Skyline Silhouette Gradient -->
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Location Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container / Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="98" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.08"/>

  <!-- ============================================ -->
  <!-- 1. INSIDE S: CITY SKYLINE BUILDINGS -->
  <!-- ============================================ -->
  <g transform="translate(160, 168)" opacity="0.95">
    <!-- City Skyline Silhouette Buildings -->
    <!-- Tower 1 -->
    <rect x="18" y="44" width="22" height="66" rx="2" fill="url(#skylineGrad)" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="24" y1="52" x2="34" y2="52" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="60" x2="34" y2="60" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="24" y1="68" x2="34" y2="68" stroke="#E0F2FE" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tower 2 (Tall Central Tower with Dome / Spire) -->
    <rect x="46" y="22" width="26" height="88" rx="2" fill="url(#skylineGrad)" stroke="#00E5FF" stroke-width="1.4"/>
    <path d="M46 24 C46 12 72 12 72 24 Z" fill="#38BDF8"/>
    <line x1="59" y1="6" x2="59" y2="16" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="59" cy="5" r="2" fill="#F43F5E"/>
    <!-- Windows Matrix -->
    <rect x="52" y="32" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="62" y="32" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="52" y="44" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="62" y="44" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="52" y="56" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="62" y="56" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="52" y="68" width="4" height="6" rx="1" fill="#FEF08A"/>
    <rect x="62" y="68" width="4" height="6" rx="1" fill="#FEF08A"/>

    <!-- Tower 3 (Angle Roof) -->
    <polygon points="78,38 100,48 100,110 78,110" fill="url(#skylineGrad)" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="84" y1="58" x2="94" y2="62" stroke="#BAE6FD" stroke-width="1.5"/>
    <line x1="84" y1="68" x2="94" y2="72" stroke="#BAE6FD" stroke-width="1.5"/>
    <line x1="84" y1="78" x2="94" y2="82" stroke="#BAE6FD" stroke-width="1.5"/>

    <!-- Tower 4 -->
    <rect x="106" y="52" width="20" height="58" rx="2" fill="url(#skylineGrad)" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="111" y1="62" x2="121" y2="62" stroke="#BAE6FD" stroke-width="1.5"/>
    <line x1="111" y1="72" x2="121" y2="72" stroke="#BAE6FD" stroke-width="1.5"/>

    <!-- Tower 5 Small -->
    <rect x="132" y="64" width="16" height="46" rx="2" fill="url(#skylineGrad)" stroke="#38BDF8" stroke-width="1"/>
    <line x1="136" y1="72" x2="144" y2="72" stroke="#BAE6FD" stroke-width="1.2"/>
    <line x1="136" y1="80" x2="144" y2="80" stroke="#BAE6FD" stroke-width="1.2"/>

    <!-- Tower 6 Spire Line -->
    <rect x="154" y="74" width="12" height="36" rx="1.5" fill="url(#skylineGrad)" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- ============================================ -->
  <!-- 2. SCULPTURAL 3D GLOWING "S" RIBBONS -->
  <!-- ============================================ -->

  <!-- S: Lower Outer Curve & Leaf Tip (Glow + Body) -->
  <g filter="url(#subtleGlow)">
    <!-- Lower Left Wing / Ribbon -->
    <path d="M120 295 
             C112 345 132 395 180 415 
             C240 440 330 425 365 375 
             C390 340 375 295 330 270 
             C285 245 220 235 180 215 
             C155 202 135 180 135 155
             C135 135 150 115 175 105
             C155 125 150 150 165 175
             C185 205 235 218 280 238
             C340 265 385 305 385 365
             C385 425 315 455 230 450
             C160 445 110 395 105 335
             C102 305 110 278 120 295 Z"
          fill="url(#bottomRibbon)"/>
  </g>

  <!-- S: Top Curve & Sweeping Upper Ribbon -->
  <g filter="url(#subtleGlow)">
    <!-- Upper Sweeping Ribbon forming Top of S -->
    <path d="M148 215 
             C142 165 175 115 245 105 
             C315 95 360 135 345 190 
             C335 225 295 245 235 245
             C190 245 155 235 148 215 Z"
          fill="url(#topRibbon)"/>

    <!-- Shiny Specular Glass Edge along Top S -->
    <path d="M175 118 
             C235 102 310 108 340 148 
             C355 170 350 205 320 225
             C275 225 215 215 180 185
             C165 168 162 142 175 118 Z"
          fill="url(#topRibbonHighlight)" opacity="0.85"/>
  </g>

  <!-- S: Main Continuous Glowing 3D Body Ribbon -->
  <g filter="url(#neonGlow)">
    <path d="M342 160 
             C330 130 295 112 245 115 
             C180 118 140 160 145 215 
             C150 260 200 280 265 300 
             C345 325 388 355 380 405 
             C370 455 290 468 215 450 
             C160 436 120 390 120 335 
             C120 315 130 295 138 310
             C142 355 175 405 230 415 
             C290 425 345 405 350 365 
             C355 325 315 300 250 275 
             C180 248 128 220 128 165 
             C128 115 180 85 255 85 
             C315 85 360 115 368 155 Z"
          fill="url(#centerRibbon)"/>
  </g>

  <!-- ============================================ -->
  <!-- 3. WINDING HIGHWAY ROAD WITH NEON MAGENTA GLOW -->
  <!-- ============================================ -->
  <g filter="url(#softGlow)">
    <!-- Curving Winding Road Path Inside Lower Loop -->
    <path d="M165 240 
             C215 248 270 265 320 290 
             C375 320 395 360 380 405 
             C360 450 280 455 220 435 
             C190 425 160 390 180 345 
             C200 305 260 345 275 385" 
          stroke="url(#roadGlow)" 
          stroke-width="12" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- High-Intensity Centerline Road Glow -->
    <path d="M175 242 
             C220 252 272 270 318 294 
             C365 322 380 358 368 395 
             C350 435 285 440 230 422" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.95"/>
  </g>

  <!-- ============================================ -->
  <!-- 4. GLOWING PURPLE/MAGENTA LOCATION PIN -->
  <!-- ============================================ -->
  <g transform="translate(320, 310)" filter="url(#subtleGlow)">
    <!-- Location Pin Body -->
    <path d="M24 0 
             C10.7 0 0 10.7 0 24 
             C0 39 20 54 24 58 
             C28 54 48 39 48 24 
             C48 10.7 37.3 0 24 0 Z" 
          fill="url(#pinGrad)" 
          stroke="#F472B6" 
          stroke-width="2"/>
    
    <!-- Pin Aperture Center Hole -->
    <circle cx="24" cy="22" r="8" fill="#11162D" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="24" cy="22" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- ============================================ -->
  <!-- 5. TOP: 3D GRADUATION CAP (MORTARBOARD) -->
  <!-- ============================================ -->
  <g transform="translate(145, 68)" filter="url(#subtleGlow)">
    <!-- Graduation Cap Skull Base -->
    <ellipse cx="110" cy="50" rx="34" ry="12" fill="#0F172A" opacity="0.9"/>
    
    <!-- Mortarboard Diamond 3D Plate Underlayer -->
    <polygon points="110,6 235,52 110,92 -15,46" fill="#090D1A"/>
    <polygon points="110,12 235,58 110,98 -15,52" fill="#020617"/>

    <!-- Mortarboard Top Surface (Glossy Cyan & Navy Gradient) -->
    <polygon points="110,6 235,52 110,92 -15,46" 
             fill="url(#capGrad)" 
             stroke="#38BDF8" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>

    <!-- Center Button on Mortarboard -->
    <ellipse cx="110" cy="50" rx="7" ry="4.5" fill="#E0F2FE"/>
    <circle cx="110" cy="49" r="2.5" fill="#00E5FF"/>

    <!-- Tassel Ribbon & Cord Draping to Right -->
    <path d="M110 50 Q160 52 195 85" stroke="url(#tasselGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="195" cy="85" r="3.5" fill="#E879F9"/>

    <!-- Tassel Hanging Body (3D Tiered) -->
    <polygon points="190,90 200,90 205,124 185,124" fill="url(#tasselGrad)" stroke="#F472B6" stroke-width="1"/>
    <polygon points="188,124 202,124 200,132 190,132" fill="#E879F9"/>
  </g>

  <!-- Specular Shimmer Flares -->
  <circle cx="150" cy="115" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
  <circle cx="340" cy="155" r="2.5" fill="#00E5FF" filter="url(#softGlow)"/>
  <circle cx="370" cy="380" r="3" fill="#F472B6" filter="url(#softGlow)"/>
</svg>
